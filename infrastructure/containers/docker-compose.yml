services:

  coder-service:
    image: genocs/coder-service:local
    hostname: coder-service
    container_name: coder-service
    ports:
      - 5070:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      logger__console__enabled: "true"
    networks:
      - genocs      

networks:
  genocs:
    name: genocs-network
    external: true
    driver: bridge
